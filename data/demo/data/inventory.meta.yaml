sheet: Inventory
description: Hardware inventory with pricing
columns:
  - id: sku
    name: SKU
    type: text
    width: 100
  - id: name
    name: Name
    type: text
    width: 220
  - id: quantity
    name: Qty
    type: number
    width: 60
  - id: unit_price
    name: Unit Price
    type: number
    format: "€#,##0.00"
    width: 100
  - id: total_value
    name: Total Value
    type: formula
    formula: "quantity * unit_price"
    format: "€#,##0.00"
    width: 110
  - id: category
    name: Category
    type: text
    width: 100
  - id: location
    name: Location
    type: text
    width: 120
